<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#EFE5D7">
<title>Анастасия Де-Колядо - нутрициолог</title>
<meta name="description" content="Анастасия Де-Колядо. Нутри-чек, Telegram-канал и Instagram. Наука о здоровье. Эстетика жизни.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* TT Norms: если шрифт установлен на устройстве, используется оригинал.
   Для одинакового отображения на всех устройствах нужен лицензированный webfont. */
@font-face{font-family:"TT Norms";src:local("TT Norms Pro Bold"),local("TT Norms Bold");font-weight:700;font-display:swap}
:root{--ivory:#EFE5D7;--teal:#2E6F73;--burgundy:#5A1F25;--ink:#293A39;--muted:#65706B;--paper:#FAF6F0;--border:#CAD2C7}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--ivory);color:var(--ink);font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(100%,460px);margin:0 auto;padding:32px 24px 26px;text-align:center}
.brand{position:relative;width:254px;max-width:90%;height:33px;margin:0 auto 25px;overflow:hidden}
.brand img{position:absolute;width:100%;height:auto;left:0;top:50%;transform:translateY(-50%)}
.portrait{width:160px;height:160px;margin:0 auto 23px;padding:5px;border:1px solid var(--teal);border-radius:50%;background:var(--ivory)}
.portrait img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:52% 44%}
h1{font-family:"Golos Text",Manrope,Arial,sans-serif;font-size:32px;line-height:1.16;letter-spacing:-.015em;font-weight:600;color:var(--burgundy);margin:0}
h1 span{display:block}
.role{margin:12px 0 0;font-size:12px;letter-spacing:.19em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.tag{font-size:13px;line-height:1.65;color:var(--muted);margin:13px 0 0}
.tag span{display:block}
nav{display:grid;gap:11px;margin-top:26px;text-align:left}
.btn{min-height:76px;display:flex;align-items:center;gap:15px;padding:16px 19px;border-radius:16px;border:1px solid var(--border);background:var(--paper);text-decoration:none;color:var(--ink);transition:background .18s,transform .18s,box-shadow .18s}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--paper);box-shadow:0 7px 18px #2E6F7314}
.btn strong{font-family:"TT Norms",Manrope,Arial,sans-serif;font-size:18px;line-height:1.3;font-weight:700;letter-spacing:-.025em}
.btn small{display:block;font-size:12px;line-height:1.5;font-weight:400;margin-top:3px;color:var(--muted)}
.primary small{color:#F1EBDF}
.ico{width:25px;height:25px;flex:none;color:var(--teal)}
.primary .ico{color:inherit}
.arrow{margin-left:auto;font-size:20px;color:var(--teal);font-weight:400;flex:none}
.primary .arrow{color:var(--paper)}
.soon{background:transparent;border-style:dashed;color:#737E76;min-height:66px}
.soon .ico{color:#7C8981}
.soon strong{font-size:16px}
.soon small{font-size:11px}
a.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px #2E6F7317}
a.btn.primary:hover{background:#255E62}
a:focus-visible{outline:3px solid var(--burgundy);outline-offset:4px}
footer{font-size:11px;color:var(--muted);margin-top:25px;letter-spacing:.035em}
@media(min-width:700px){main{padding-top:44px;padding-bottom:36px}}
@media(max-width:350px){main{padding:25px 18px}h1{font-size:29px}.btn{padding:15px;gap:11px}.btn strong{font-size:16px}.btn small{font-size:11px}.portrait{width:145px;height:145px}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}a.btn:hover{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><img src="img/logo.png" alt="DEKOLYADO.HEALTH" width="762" height="254"></div>
    <div class="portrait"><img src="img/portrait.jpg" alt="Анастасия Де-Колядо" width="480" height="480" fetchpriority="high"></div>
    <h1><span>Анастасия</span><span>Де-Колядо</span></h1>
    <p class="role">Нутрициолог</p>
    <p class="tag"><span>Nutrition &amp; Longevity</span><span>Наука о здоровье. Эстетика жизни.</span></p>
  </header>
  <nav aria-label="Мои проекты и социальные сети">
    <a class="btn primary" href="https://t.me/dekolyado_nutricheck_bot" target="_blank" rel="noopener noreferrer">
      <svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
      <span><strong>Нутри-чек</strong><small>Бесплатный опросник и гайд</small></span><span class="arrow" aria-hidden="true">↗</span>
    </a>
    <a class="btn" href="https://t.me/dekolyadohealth" target="_blank" rel="noopener noreferrer">
      <svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m21 4-3 16-6-5-4 4v-6L3 11Z"/><path d="m8 13 13-9M12 15l9-11"/></svg>
      <span><strong>Telegram-канал</strong><small>@dekolyadohealth</small></span><span class="arrow" aria-hidden="true">↗</span>
    </a>
    <a class="btn" href="https://instagram.com/dekolyado.health" target="_blank" rel="noopener noreferrer">
      <svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      <span><strong>Instagram</strong><small>@dekolyado.health</small></span><span class="arrow" aria-hidden="true">↗</span>
    </a>
    <!-- Когда сайт готов, заменить этот div ссылкой с нужным адресом и убрать soon. -->
    <div class="btn soon" aria-label="Сайт - скоро">
      <svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a17 17 0 0 1 0 18M12 3a17 17 0 0 0 0 18"/></svg>
      <span><strong>Сайт</strong><small>Скоро</small></span>
    </div>
  </nav>
  <footer>dekolyadohealth.ru</footer>
</main>
</body>
</html>
